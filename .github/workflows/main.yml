name: Resume Evaluation Tool - CI/CD

on:
  push:
    branches:
      - main  # Runs on every push to main branch
  pull_request:
    branches:
      - main  # Runs on every pull request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'  # Cache dependencies

      - name: Install Dependencies
        run: |
          set -e  # Exit on any error
          python -m pip install --upgrade pip || exit 1
          pip install -r requirements.txt || exit 1

      - name: Ensure spaCy Model is Installed
        run: |
          python -c "import spacy; spacy.load('en_core_web_sm')" || python -m spacy download en_core_web_sm

      - name: Run Tests
        run: |
          pytest tests/ || exit 1  # Replace with actual test command

      - name: Start Application
        run: |
          python app.py || exit 1  # Modify based on your app’s startup command
